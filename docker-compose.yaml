
services:
  # ===== MINIO CLUSTER (distributed, 4 nodes) =====
  minio1:
    image: minio/minio:latest
    container_name: minio1
    command: server --console-address ":9001" http://minio{1...4}/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio1-data:/data
    networks: [app_net]
    ports:
      - "9000:9000"
      - "9001:9001"

  minio2:
    image: minio/minio:latest
    container_name: minio2
    command: server --console-address ":9001" http://minio{1...4}/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio2-data:/data
    networks: [app_net]


  minio3:
    image: minio/minio:latest
    container_name: minio3
    command: server --console-address ":9001" http://minio{1...4}/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio3-data:/data
    networks: [app_net]

  minio4:
    image: minio/minio:latest
    container_name: minio4
    command: server --console-address ":9001" http://minio{1...4}/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio4-data:/data
    networks: [app_net]

    # ===== MINIO CLIENT (one-shot init) =====
  mc:
    image: minio/mc:latest
    container_name: mc_init
    depends_on: [minio1, minio2, minio3, minio4]
    environment:
      - MINIO_ALIAS=local
      - MINIO_ENDPOINT=http://minio1:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    entrypoint: ["/bin/sh","-c"]
    command: |
      "set -e;
      until (/usr/bin/mc alias set $${MINIO_ALIAS} $${MINIO_ENDPOINT} $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do echo 'waiting for minio...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing $${MINIO_ALIAS}/$${S3_BUCKET};
      # Create a restricted user for the gateway
      /usr/bin/mc admin user add $${MINIO_ALIAS} $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
      # Policy: allow put/get on the project bucket only
      cat <<'POL' > /tmp/gateway-policy.json
      {
        "Version": "2012-10-17",
        "Statement": [
        {"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::${S3_BUCKET}"]},
        {"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::${S3_BUCKET}/*"]}
        ]
      }
      POL 
      /usr/bin/mc admin policy add $${MINIO_ALIAS} gateway-policy /tmp/gateway-policy.json;
      /usr/bin/mc admin policy set $${MINIO_ALIAS} gateway-policy user=$${S3_ACCESS_KEY};
      # Lock bucket: no anonymous access
      /usr/bin/mc anonymous set none $${MINIO_ALIAS}/$${S3_BUCKET};
      echo 'MinIO initialized.'"
    networks: [app_net]
    restart: "no"

    # ===== POSTGRES =====
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [app_net]

    # ===== GATEWAY (FastAPI) =====
  gateway:
    build: ./gateway
    container_name: gateway
    environment:
      - S3_ENDPOINT=http://minio1:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - PUBLIC_S3_ENDPOINT=http://localhost:9000
      - DATABASE_URL=postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
    depends_on: [postgres, mc]
    ports:
      - "${GATEWAY_PORT}:8080"
    networks: [app_net]


networks:
  app_net:
    driver: bridge


volumes:
  minio1-data:
  minio2-data:
  minio3-data:
  minio4-data:
  pg-data: