version: '3.8'

services:
  # Gateway Server (existing backend)
  gateway:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    depends_on:
      - node1
      - node2
      - node3
      - node4
      - node5
      - node6
    networks:
      - storage-network

  # Storage Node 1
  node1:
    build: ./storage-node
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - NODE_ID=node-4001
    volumes:
      - node1-data:/app/data
    networks:
      - storage-network

  # Storage Node 2
  node2:
    build: ./storage-node
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - NODE_ID=node-4002
    volumes:
      - node2-data:/app/data
    networks:
      - storage-network

  # Storage Node 3
  node3:
    build: ./storage-node
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - NODE_ID=node-4003
    volumes:
      - node3-data:/app/data
    networks:
      - storage-network

  # Storage Node 4
  node4:
    build: ./storage-node
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - NODE_ID=node-4004
    volumes:
      - node4-data:/app/data
    networks:
      - storage-network

  # Storage Node 5
  node5:
    build: ./storage-node
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - NODE_ID=node-4005
    volumes:
      - node5-data:/app/data
    networks:
      - storage-network

  # Storage Node 6
  node6:
    build: ./storage-node
    ports:
      - "4006:4006"
    environment:
      - PORT=4006
      - NODE_ID=node-4006
    volumes:
      - node6-data:/app/data
    networks:
      - storage-network

  # Frontend (optional)
  frontend:
    build: .
    ports:
      - "5173:5173"
    depends_on:
      - gateway
    networks:
      - storage-network

networks:
  storage-network:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
  node6-data:
